name: Compilar TicTac

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar LibMan
        run: dotnet tool install -g Microsoft.Web.LibraryManager.Cli
      - name: Restaurar cliente SignalR
        working-directory: TicTac.Client
        run: $HOME/.dotnet/tools/libman restore
      - name: Restaurar dependencias
        run: dotnet restore TicTac.sln
      - name: Compilar
        run: dotnet build TicTac.sln --no-restore --configuration Release
